name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Play upload keystore (optional)
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          {
            echo "UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore"
            echo "UPLOAD_KEYSTORE_PASSWORD=${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}"
            echo "UPLOAD_KEY_ALIAS=${{ secrets.UPLOAD_KEY_ALIAS }}"
            echo "UPLOAD_KEY_PASSWORD=${{ secrets.UPLOAD_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Build debug APK and release bundle
        run: ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Rename outputs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk shelfie-debug.apk
          cp app/build/outputs/bundle/release/app-release.aab shelfie-release.aab

      # Play only accepts bundles signed with the registered upload key, so the
      # upload keystore has to be in play too - the fallback shared keystore
      # would be rejected.
      - name: Publish to Play internal testing
        if: env.PLAY_SERVICE_ACCOUNT_JSON != '' && env.UPLOAD_KEYSTORE_BASE64 != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.shelfie.zbuddy
          releaseFiles: shelfie-release.aab
          track: internal
          status: completed

      - name: Explain skipped Play upload
        if: env.PLAY_SERVICE_ACCOUNT_JSON == '' || env.UPLOAD_KEYSTORE_BASE64 == ''
        run: |
          echo "::notice::Skipped the Play internal-track upload. It needs both" \
            "PLAY_SERVICE_ACCOUNT_JSON (a Play Console service-account key with" \
            "release permissions) and UPLOAD_KEYSTORE_BASE64 as repository secrets." \
            "PLAY_SERVICE_ACCOUNT_JSON set: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' }}." \
            "UPLOAD_KEYSTORE_BASE64 set: ${{ env.UPLOAD_KEYSTORE_BASE64 != '' }}."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shelfie-debug-apk
          path: shelfie-debug.apk

      - name: Upload Play bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: shelfie-release-aab
          path: shelfie-release.aab

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Publishes a release for the pushed tag (e.g. v0.9.0).
          name: ${{ github.ref_name }}
          body: |
            Built from tag `${{ github.ref_name }}`.
            Download `shelfie-debug.apk` below and sideload it on your device.
            `shelfie-release.aab` is the Google Play upload bundle.
          files: |
            shelfie-debug.apk
            shelfie-release.aab
